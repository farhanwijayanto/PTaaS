# PTaaS Cloud — Local Development Control Plane & Remote Desktop Stack
# Student VMs are NEVER statically pre-defined here with fixed host ports or shared passwords.
# Every "Create VM" provisions a new isolated container (`ptaas-vm-<short-id>`), dedicated volume
# (`ptaas-vol-<short-id>`), and internal per-tenant network (`ptaas-lab-<tenant>`) via the Docker Engine API.
#
# Usage:
#   node scripts/prepare-images.mjs
#   docker compose -f gateway/docker-compose.dev.yml up -d
#   DEMO_MODE=false DOCKER_PROXY_URL=http://127.0.0.1:2375 PTAAS_GATEWAY_CONTAINER=ptaas-guacd npm run start

services:
  # Least-privilege Docker API proxy: allows ONLY the endpoints needed by PTaaS backend
  # (containers, volumes, networks, images inspect/pull, events, info, ping).
  # Never mount /var/run/docker.sock into any student workload container.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ptaas-docker-proxy
    restart: unless-stopped
    privileged: false
    read_only: true
    tmpfs:
      - /run
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      - LOG_LEVEL=warning
      - PING=1
      - EVENTS=1
      - CONTAINERS=1
      - VOLUMES=1
      - NETWORKS=1
      - IMAGES=1
      - INFO=1
      - POST=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - GRPC=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ptaas-control

  # Guacamole proxy daemon: connects to per-VM containers over their internal tenant networks
  # using live container IPs resolved by `ptaas.vm-id` label (no fixed VM host ports).
  guacd:
    image: guacamole/guacd:1.5.5
    container_name: ptaas-guacd
    restart: unless-stopped
    ports:
      - "127.0.0.1:4822:4822"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - ptaas-control

  # Optional practice lab target (not assigned as a student VM; opt-in via `--profile lab-targets`).
  dvwa-target:
    profiles: ["lab-targets"]
    image: vulnerables/web-dvwa:latest
    container_name: ptaas-target-dvwa
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - ptaas-lab-cs-401

networks:
  ptaas-control:
    driver: bridge
  ptaas-lab-cs-401:
    name: ptaas-lab-cs-401
    driver: bridge
    internal: true
